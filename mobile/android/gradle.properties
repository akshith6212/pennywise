# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true

# Android SDK
android.useAndroidX=true

# React Native - New Architecture
newArchEnabled=false

# Hermes engine
hermesEnabled=true

# Release signing (populated from CI secrets or local gradle.properties)
# PENNYWISE_UPLOAD_STORE_FILE=pennywise-release.keystore
# PENNYWISE_UPLOAD_STORE_PASSWORD=****
# PENNYWISE_UPLOAD_KEY_ALIAS=pennywise-key
# PENNYWISE_UPLOAD_KEY_PASSWORD=****
